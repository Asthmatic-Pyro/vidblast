name: VidBlast CI
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install
        run: npm ci || npm install
      - name: Type Check
        run: npm run -s type-check || true
      - name: Run Heartbeat (dry)
        run: echo "Heartbeat dry run on CI"
